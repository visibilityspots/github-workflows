name: trivy

on:
  push:
    tags:
      - '*'
  schedule:
    - cron: '44 19 * * 4'
  workflow_call:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
  # Trivy tries these in order. ECR alone failed on 2026-10-27 with
  # "TOOMANYREQUESTS: Data limit exceeded" on two runs in a row; mirror.gcr.io is
  # Trivy's own default since v0.56, ghcr.io and ECR stay as fallbacks.
  TRIVY_DB_REPOSITORY: 'mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2'
  TRIVY_JAVA_DB_REPOSITORY: 'mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1'

jobs:
  scan:
    permissions:
      contents: read
      security-events: write

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Build an image from Dockerfile
        run: |
          docker build -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:dev .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:dev'
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Store Trivy vulnerability scanner output
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:dev'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
