name: CI

on:
  push:
    tags:
      - '*'
  workflow_call:
    inputs:
      platforms:
        required: false
        type: string
      run_args:
        description: >-
          Extra arguments for the container runtime, inserted before the image in
          the dgoss run command. Use it to pass -e VARS the image needs to start,
          or --entrypoint for images whose own entrypoint exits immediately and
          would leave nothing running for goss to test.
        required: false
        type: string
      goss_cmd:
        description: >-
          Arguments passed to the container itself, after the image. Takes
          precedence over the GOSS_CMD secret; use this when the arguments are
          not sensitive.
        required: false
        type: string
      pr_run_args:
        description: >-
          Replaces run_args on pull_request runs. Dependabot PRs get no secrets,
          so an image whose tag run needs GOSS_CMD sets a secret-free test here.
        required: false
        type: string
      pr_goss_cmd:
        description: Replaces goss_cmd and GOSS_CMD on pull_request runs.
        required: false
        type: string
    secrets:
      # not required: pull_request runs only test, and Dependabot PRs get no secrets
      DOCKERHUB_TOKEN:
        required: false
      GOSS_CMD:
        required: false
env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
  DOCKERHUB_PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64' }}

jobs:
  # Runs on tags and on pull requests. A PR tests its own head; a tag tests main
  # (see the github-workflow skill: test and deploy check out different refs).
  # The image name is local only, so it does not depend on repository vars,
  # which a Dependabot PR run may not see.
  test:
    runs-on: ubuntu-24.04

    env:
      TEST_IMAGE: ci/${{ github.event.repository.name }}:dev

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Build ${{ env.TEST_IMAGE }} image
        run: docker build -t ${{ env.TEST_IMAGE }} .

      # our own action next to this file; a reusable workflow cannot use ./
      # (that would resolve in the calling repo), so it is addressed in full
      - uses: visibilityspots/github-workflows/.github/actions/setup-goss@main
        with:
          version: v0.4.10

      - name: Execute dgoss run on ${{ env.TEST_IMAGE }} image
        env:
          GOSS_FILES_STRATEGY: cp
        run: >-
          dgoss run
          ${{ github.event_name == 'pull_request' && inputs.pr_run_args || inputs.run_args }}
          ${{ env.TEST_IMAGE }}
          ${{ github.event_name == 'pull_request' && inputs.pr_goss_cmd || inputs.goss_cmd || secrets.GOSS_CMD }}

  deploy:
    needs: test
    # a pull request only tests; publishing stays tag-only
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # full history and tags, to find the previous release tag below
          fetch-depth: 0

      - uses: docker/login-action@v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ env.DOCKERHUB_REPOSITORY }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.DOCKERHUB_PLATFORMS }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:buildcache,mode=max

      # changelog-action's own `tag` mode asks GitHub for the newest tag by
      # TAG_COMMIT_DATE and fails when that is not the tag being built. GitHub
      # does not always order them by commit date: on dockerfile-baikal it put
      # v0.12.1 above the newer v0.12.1-1 and the release step never ran. So
      # the previous tag comes from git instead: the nearest tag reachable from
      # the tagged commit's parent, or the root commit for a first release.
      - name: Find the previous tag
        id: previous
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null) ||
            previous=$(git rev-list --max-parents=0 "${GITHUB_REF_NAME}" | tail -n 1)
          echo "previous ${previous} -> ${GITHUB_REF_NAME}"
          echo "tag=${previous}" >> "$GITHUB_OUTPUT"

      - name: Generate CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          fromTag: ${{ github.ref_name }}
          toTag: ${{ steps.previous.outputs.tag }}

      - name: Create github ${{ github.ref_name }} release
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          allowUpdates: true
          body: ${{ steps.changelog.output.changes }}
          token: ${{ github.token }}

      - name: Commit updated CHANGELOG.md for ${{ github.ref_name }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: 'docs: update CHANGELOG.md for ${{ github.ref_name }} [skip ci]'
          file_pattern: CHANGELOG.md
